<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doodle Ghost Desktop Pet</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #dff6ff;
            font-family: Arial, sans-serif;
            position: relative;
        }

        /* Small desktop-style background */
        .desktop {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, #ffffff 0 3px, transparent 4px),
                radial-gradient(circle at 80% 30%, #ffffff 0 3px, transparent 4px),
                #dff6ff;
        }

        /* Ghost */
        .ghost {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 170px;
            height: 190px;
            cursor: pointer;
            animation: float 3s ease-in-out infinite;
            user-select: none;
        }

        .ghost-body {
            position: absolute;
            width: 140px;
            height: 155px;
            left: 15px;
            top: 10px;
            background: white;
            border: 5px solid #222;
            border-radius: 70px 70px 35px 35px;
            box-shadow: 6px 7px 0 #222;
        }

        /* Wavy bottom */
        .ghost-body::after {
            content: "";
            position: absolute;
            left: -5px;
            bottom: -30px;
            width: 140px;
            height: 45px;
            background: white;
            border-left: 5px solid #222;
            border-right: 5px solid #222;
            border-bottom: 5px solid #222;
            clip-path: polygon(
                0 0,
                20% 35%,
                40% 0,
                60% 35%,
                80% 0,
                100% 35%,
                100% 100%,
                0 100%
            );
        }

        /* Eyes */
        .eye {
            position: absolute;
            width: 18px;
            height: 25px;
            background: #222;
            border-radius: 50%;
            top: 55px;
        }

        .eye.left {
            left: 42px;
        }

        .eye.right {
            right: 42px;
        }

        /* Cute mouth */
        .mouth {
            position: absolute;
            width: 28px;
            height: 20px;
            border: 4px solid #222;
            border-top: none;
            border-radius: 0 0 20px 20px;
            left: 51px;
            top: 88px;
        }

        /* Cheeks */
        .cheek {
            position: absolute;
            width: 15px;
            height: 8px;
            background: #ffb6c9;
            border-radius: 50%;
            top: 92px;
        }

        .cheek.left {
            left: 20px;
        }

        .cheek.right {
            right: 20px;
        }

        /* Little arms */
        .arm {
            position: absolute;
            width: 35px;
            height: 15px;
            border-top: 5px solid #222;
            border-radius: 50%;
            top: 95px;
        }

        .arm.left {
            left: -8px;
            transform: rotate(-25deg);
        }

        .arm.right {
            right: -8px;
            transform: rotate(25deg);
        }

        /* Floating animation */
        @keyframes float {
            0%, 100% {
                transform: translate(-50%, -50%) translateY(0);
            }

            50% {
                transform: translate(-50%, -50%) translateY(-15px);
            }
        }

        /* Speech bubble */
        .bubble {
            position: absolute;
            top: -65px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border: 3px solid #222;
            border-radius: 15px;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 3px 3px 0 #222;
        }

        .bubble::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 50%;
            width: 15px;
            height: 15px;
            background: white;
            border-right: 3px solid #222;
            border-bottom: 3px solid #222;
            transform: translateX(-50%) rotate(45deg);
        }

        /* Title */
        .title {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            font-weight: bold;
            color: #222;
        }

        /* Click instruction */
        .instruction {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #444;
        }
    </style>
</head>

<body>

    <div class="desktop">

        <div class="title">
            👻 My Doodle Ghost
        </div>

        <div class="ghost" onclick="ghostMessage()">

            <div class="bubble" id="bubble">
                Boo! 👻
            </div>

            <div class="ghost-body">

                <div class="eye left"></div>
                <div class="eye right"></div>

                <div class="cheek left"></div>
                <div class="cheek right"></div>

                <div class="mouth"></div>

            </div>

            <div class="arm left"></div>
            <div class="arm right"></div>

        </div>

        <div class="instruction">
            Click the ghost! ✨
        </div>

    </div>

    <script>
        const messages = [
            "Boo! 👻",
            "Hello! ✨",
            "I'm your ghost!",
            "Hehe! 👻",
            "Feed me attention! 💕",
            "Don't be scared!",
            "You're doing great! ⭐",
            "Booooo! 😂"
        ];

        function ghostMessage() {
            const bubble = document.getElementById("bubble");

            const randomMessage =
                messages[Math.floor(Math.random() * messages.length)];

            bubble.textContent = randomMessage;
        }
    </script>

</body>
</html>
