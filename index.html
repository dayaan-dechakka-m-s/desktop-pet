<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doodle Desktop Pets</title>
  <style>
    body {
      margin: 0;
      background: #f0f8ff; /* light background so pets are visible */
      overflow: hidden;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
      color: #333;
    }

    /* Container for pets */
    .pet-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      pointer-events: none; /* pets don’t block clicks */
    }

    .pet {
      width: 100px;
      height: 100px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      animation: bounce 2s infinite ease-in-out;
    }

    /* Ghost doodle only */
    .ghost {
      background-image: url('ghost-doodle.png');
    }

    /* Bouncing animation */
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
  </style>
</head>
<body>
  <h1>🐾 Welcome to Doodle Desktop Pets 🐾</h1>
  <p>Now it's only about the ghost! Make sure <b>ghost-doodle.png</b> is in the same folder as this file.</p>

  <div class="pet-container">
    <div class="pet ghost"></div>
  </div>
</body>
</html>
